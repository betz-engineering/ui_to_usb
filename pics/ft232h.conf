# Configuration file for FT232H EEPROM

vendor_id=0x0403      # Keep FTDI's default Vendor ID
product_id=0x6014     # Keep FTDI's default Product ID for FT232H

manufacturer="Betz Engineering"
product="ui_to_usb"
serial="R-S00e"      # The initial serial number

use_serial=true       # This is CRUCIAL. It enables the serial number and tells
                      # ftdi_eeprom to auto-increment it on subsequent flashes.

self_powered=false    # Set to 'true' if your device has its own power source.
max_power=250         # Max power draw from USB in mA. Adjust as needed.


# --- Pin Configuration ---
cbush0=TRISTATE
cbush1=TRISTATE
cbush2=TRISTATE
cbush3=TRISTATE
cbush4=TRISTATE
cbush5=TRISTATE
cbush6=TRISTATE
cbush7=TRISTATE
cbush8=TRISTATE
cbush9=IOMODE
